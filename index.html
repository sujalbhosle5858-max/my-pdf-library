<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My PDF Library</title>
<style>
* {
  box-sizing: border-box;
}
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #0f172a;
  color: white;
}
.container {
  max-width: 450px;
  margin: auto;
  padding: 25px;
}
h1 {
  text-align: center;
  color: #60a5fa;
}
input {
  width: 100%;
  padding: 14px;
  margin: 10px 0;
  border-radius: 10px;
  border: none;
  background: #1e293b;
  color: white;
  font-size: 16px;
}
button {
  width: 100%;
  padding: 14px;
  margin-top: 15px;
  border: none;
  border-radius: 10px;
  background: #2563eb;
  color: white;
  font-size: 17px;
  font-weight: bold;
  cursor: pointer;
}
#dashboard {
  display: none;
}
.folders {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 15px;
  margin-top: 25px;
}
.folder {
  background: #1e293b;
  padding: 25px 10px;
  border-radius: 15px;
  text-align: center;
  font-size: 17px;
  cursor: pointer;
  border: 1px solid #334155;
}
.folder span {
  display: block;
  font-size: 40px;
  margin-bottom: 10px;
}
.pdf {
  display: block;
  padding: 15px;
  margin: 12px 0;
  background: #1e293b;
  border-radius: 10px;
  color: white;
  text-decoration: none;
  border-left: 4px solid #38bdf8;
  font-size: 16px;
}
.back {
  background: #475569;
}
</style>
</head>
<body>

<div class="container">

  <div id="login">
    <h1>📚 My PDF Library</h1>
    <p style="text-align:center">Welcome! Login to access your PDFs</p>
    <input id="name" placeholder="Enter Your Name">
    <input id="mobile" type="tel" maxlength="10" placeholder="Enter Mobile Number">
    <input id="password" type="password" placeholder="Enter Password">
    <button onclick="login()">NEXT →</button>
  </div>

  <div id="dashboard">
    <h1>📂 My Folders</h1>
    <p id="welcome" style="text-align:center; color:#38bdf8; font-weight:bold;"></p>

    <div class="folders">
      <div class="folder" onclick="openFolder('engineering')">
        <span>📁</span>
        Engineering
      </div>
      <div class="folder" onclick="openFolder('assignment')">
        <span>📁</span>
        Assignments
      </div>
      <div class="folder" onclick="openFolder('papers')">
        <span>📁</span>
        Previous Papers
      </div>
      <div class="folder" onclick="openFolder('notes')">
        <span>📁</span>
        Notes
      </div>
    </div>

    <div id="pdfList" style="margin-top: 20px;"></div>

    <button class="back" onclick="logout()">LOGOUT</button>
  </div>

</div>

<iframe name="hidden_iframe" id="hidden_iframe" style="display:none;"></iframe>
<form id="gform" action="https://docs.google.com/forms/d/e/1FAIpQLSeSLQuTsgiEZghUq6Baf9oG3B3j4gYm_W10GsbhKvjRvwnWZw/formResponse" method="POST" target="hidden_iframe" style="display:none;">
  <input type="text" name="entry.1752123307" id="gname">
  <input type="text" name="entry.257478073" id="gmobile">
</form>

<script>
const FIXED_PASSWORD = "Sun@0909";

function login() {
  let name = document.getElementById("name").value.trim();
  let mobile = document.getElementById("mobile").value.trim();
  let password = document.getElementById("password").value;

  if (name === "" || mobile === "" || password === "") {
    alert("Please fill all details!");
    return;
  }

  if (!/^[0-9]{10}$/.test(mobile)) {
    alert("Please enter a valid 10-digit mobile number!");
    return;
  }

  if (password !== FIXED_PASSWORD) {
    alert("Wrong Password! Please try again.");
    return;
  }

  document.getElementById("gname").value = name;
  document.getElementById("gmobile").value = mobile;
  document.getElementById("gform").submit();

  document.getElementById("login").style.display = "none";
  document.getElementById("dashboard").style.display = "block";
  document.getElementById("welcome").innerText = "Welcome, " + name + "!";
}

function openFolder(folder) {
  let pdfList = document.getElementById("pdfList");

  let files = {
    engineering: [
      { 
        title: "Chemistry Unit 1 Notes 2024", 
        url: "https://raw.githubusercontent.com/sujalbhosle5858-max/my-pdf-library/main/Chemistry%20unit%201%20notes%202024%20pattern%20by%20imp%20solution%20hub.pdf" 
      }
    ],
    assignment: [],
    papers: [],
    notes: []
  };

  pdfList.innerHTML = "<h2>📄 PDF Files</h2>";

  if (!files[folder] || files[folder].length === 0) {
    pdfList.innerHTML += "<p style='color:#94a3b8;'>No files in this folder.</p>";
    return;
  }

  files[folder].forEach(function(item) {
    let link = document.createElement("a");
    link.className = "pdf";
    link.innerText = "📥 " + item.title + " (Download / View)";
    link.href = item.url;
    link.target = "_blank";
    pdfList.appendChild(link);
  });
}

function logout() {
  document.getElementById("dashboard").style.display = "none";
  document.getElementById("login").style.display = "block";
  document.getElementById("pdfList").innerHTML = "";
  document.getElementById("password").value = "";
}
</script>

</body>
</html>
